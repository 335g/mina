[workspace]
members = ["mina-core", "mina-view", "mina-protocol", "mina-term"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[workspace.dependencies]
ropey = "1"
smallvec = "1"
unicode-segmentation = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs"] }
libc = "0.2"
termina = { version = "0.3", features = ["event-stream"] }
futures-lite = "2"
unicode-width = "0.2"

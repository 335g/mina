[workspace]
members = ["mina-text", "mina-view", "mina-protocol", "mina-conn", "mina-lsp", "mina-loader", "minae", "minad", "minas", "mina-debug"]
resolver = "3"

[workspace.package]
version = "0.0.6"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/335g/mina"

[workspace.dependencies]
ropey = "1"
smallvec = "1"
unicode-segmentation = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs", "process"] }
libc = "0.2"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
unicode-width = "0.2"
clap = { version = "4", features = ["derive"] }
cliclack = "0.5"
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"

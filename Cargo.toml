[workspace]
members = ["minae-core", "minae-view", "minae-protocol", "minae-lsp", "minae-term", "minae-debug", "minae-loader", "tmp/dev01", "tmp/dev02"]
resolver = "3"

[workspace.package]
version = "0.0.2"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/335g/minae"

[workspace.dependencies]
ropey = "1"
smallvec = "1"
unicode-segmentation = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs", "process"] }
libc = "0.2"
termina = { version = "0.3", features = ["event-stream"] }
futures-lite = "2"
unicode-width = "0.2"
clap = { version = "4", features = ["derive"] }
cliclack = "0.5"
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"

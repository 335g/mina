[package]
name = "minae"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Terminal UI, daemon, and agent entry for minae"

[[bin]]
name = "minae"
path = "src/main.rs"

[dependencies]
minae-core = { path = "../minae-core", version = "0.0.3" }
minae-view = { path = "../minae-view", version = "0.0.3" }
minae-protocol = { path = "../minae-protocol", version = "0.0.3" }
minae-conn = { path = "../minae-conn", version = "0.0.3" }
minae-lsp = { path = "../minae-lsp", version = "0.0.3" }
minae-loader = { path = "../minae-loader", version = "0.0.3" }
tree-sitter.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
libc.workspace = true
clap.workspace = true
# TUI のみ（tui feature）: デフォルトビルドには含めない
termina = { workspace = true, optional = true }
futures-lite = { workspace = true, optional = true }
unicode-width = { workspace = true, optional = true }
cliclack = { workspace = true, optional = true }

[features]
default = []
tui = ["dep:termina", "dep:futures-lite", "dep:unicode-width", "dep:cliclack"]

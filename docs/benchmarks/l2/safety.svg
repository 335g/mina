<text x="484" y="284" fill="#666" font-size="10">位置指定は 1 編集に Open + edit + Save の 3 往復かかる（apply は 1 往復）</text>
<text x="14" y="352" font-size="13" font-weight="bold">並行変更を黙って消した run</text>
<line x1="30" y1="540" x2="454" y2="540" stroke="#888"/>
<text x="81.2" y="533.0" text-anchor="middle" fill="#888" font-weight="bold">0/21</text><text x="81.2" y="556" text-anchor="middle" fill="#333" font-size="10">native</text>
<rect x="158.1" y="536.3" width="51.2" height="3.7" fill="#c0392b"/>
<text x="183.8" y="529.3" text-anchor="middle" fill="#c0392b" font-weight="bold">1/30</text><text x="183.8" y="556" text-anchor="middle" fill="#333" font-size="10">naive</text>
<text x="286.2" y="533.0" text-anchor="middle" fill="#888" font-weight="bold">0/41</text><text x="286.2" y="556" text-anchor="middle" fill="#333" font-size="10">minas</text>
<text x="388.8" y="533.0" text-anchor="middle" fill="#888" font-weight="bold">0/10</text><text x="388.8" y="556" text-anchor="middle" fill="#333" font-size="10">positional</text>
<text x="14" y="614" fill="#666" font-size="10">drift 注入が当たった run のみ。失った run はどれも「成功」と報告している</text>
<text x="484" y="352" font-size="13" font-weight="bold">費用ゼロで毎回検証する不変条件（ab.py selftest）</text>
<text x="494" y="378" fill="#2e8b57" font-weight="bold">PASS</text><text x="540" y="378" fill="#333">無検証の全文書戻しは外部変更を消す</text><text x="540" y="392" fill="#666" font-size="10">消える = 欠陥が実在する</text>
<text x="494" y="412" fill="#2e8b57" font-weight="bold">PASS</text><text x="540" y="412" fill="#333">minas apply は同じ状況でも保つ</text><text x="540" y="426" fill="#666" font-size="10">消えない = 契約が守る</text>
<text x="494" y="446" fill="#2e8b57" font-weight="bold">PASS</text><text x="540" y="446" fill="#333">位置指定の edit は expected_text 無しで拒否</text><text x="540" y="460" fill="#666" font-size="10">rc=1 で実行されない</text>
<text x="494" y="480" fill="#2e8b57" font-weight="bold">PASS</text><text x="540" y="480" fill="#333">drift 注入が当たる / 外れたら検出</text><text x="540" y="494" fill="#666" font-size="10">安全指標 ext_lost 自体の検証</text>
<text x="494" y="514" fill="#2e8b57" font-weight="bold">PASS</text><text x="540" y="514" fill="#333">各 arm の custom tool の TS 構文</text><text x="540" y="528" fill="#666" font-size="10">計器の生成ミスを検出</text>
<text x="484" y="614" fill="#666" font-size="10">赤ければ掃引を回さない（LLM 費用ゼロ・1〜2 分）</text>
</svg>
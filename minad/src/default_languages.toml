# 埋め込み既定の言語テーブル（ADR-0030）
# 検証済みサーバのみを同梱する（規定サーバ方針）。ユーザーファイル
# ($XDG_CONFIG_HOME/minae/languages.toml) が name / id 単位で上書き・追加する。
# root-markers を書かなければ WorkspaceRoot 判定は汎用集合
# （Cargo.toml / package.json / pyproject.toml / go.mod / .git）を使う。
# 書けばそのリストで置換（.git を含めたければ自分で書く）。ADR-0030 Stage 2。

[language-server.rust-analyzer]
command = "rust-analyzer"
args = []
# initializationOptions: rust-analyzer は inlay hints を明示 ON にしないと既定オフ
# （ADR-0020 の型・パラメータヒントを維持。他はサーバ既定のまま）。
# `files.watcher = "server"`: rust-analyzer の既定は "client" で、ワークスペースの
# ファイル変更（Cargo.toml の編集・新規メンバー・未オープンの新規ファイル）を
# **クライアントが通知する前提**になっている。daemon は didChangeWatchedFiles を
# 実装していない（ADR-0015 で延期）ため、既定のままだと crate graph が
# 古いまま/空のまま固まり、workspace/symbol・references・hover・rename が
# 無言で空を返す（ドッグフーディング #18。実測: 新規メンバーを足しても
# `minas symbol` が [] のままで、daemon 再起動で見えるようになった）。
# "server" にすると rust-analyzer 自身が監視して再ロードする。
config = { "rust-analyzer" = { inlayHints = { typeHints = { enable = true }, parameterHints = { enable = true } }, files = { watcher = "server" } } }

[[language]]
name = "rust"
file-types = ["rs"]
language-server = "rust-analyzer"
grammar = "rust"

[language-server.typescript-language-server]
command = "typescript-language-server"
args = ["--stdio"]
# init options（inlay hints 等）は t9 風 A/B 検証で確定してから足す（規定サーバ方針）

# TS/JS のファイル種別は **languageId 単位**で分ける（ADR-0064）。tsserver は
# `languageId` から scriptKind を決めるので、.tsx を "typescript" として開くと
# JSX として解析されない（実測: 既定表は "ts" のみで、.tsx/.jsx/.js は
# 「no LSP server configured」で全コマンドが拒否されていた — ドッグフーディング #1）。
# 4 エントリは同じ grammar（tree-sitter typescript）を共有する。
# 代償: 同一プロジェクトに .ts と .tsx があると languageId ごとにセッションが
# 分かれる（ADR-0030 Stage 4 の設計）。tsserver は 1 プロセスで 4 言語を扱えるので、
# 「root × languageId」より「root × server」で共有する方が正しい可能性がある —
# 別の設計課題として残す（ADR-0064 の Considered Options）。
[[language]]
name = "typescript"
file-types = ["ts", "mts", "cts"]
language-server = "typescript-language-server"
grammar = "typescript"

[[language]]
name = "typescriptreact"
file-types = ["tsx"]
language-server = "typescript-language-server"
grammar = "typescript"

[[language]]
name = "javascript"
file-types = ["js", "mjs", "cjs"]
language-server = "typescript-language-server"
grammar = "typescript"

[[language]]
name = "javascriptreact"
file-types = ["jsx"]
language-server = "typescript-language-server"
grammar = "typescript"
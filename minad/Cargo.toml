[package]
name = "minad"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Resident daemon for minae: owns editor state, LSP sessions, and serves clients"

[[bin]]
name = "minad"
path = "src/main.rs"

[dependencies]
mina-text = { path = "../mina-text", version = "0.0.5" }
mina-view = { path = "../mina-view", version = "0.0.5" }
mina-protocol = { path = "../mina-protocol", version = "0.0.5" }
mina-lsp = { path = "../mina-lsp", version = "0.0.5" }
mina-loader = { path = "../mina-loader", version = "0.0.5" }
tree-sitter.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
libc.workspace = true
clap.workspace = true
